# TAXII Server Configuration
server:
  host: '0.0.0.0'
  port: 5000
  debug: false
  cors_origins: ['*']

database:
  # --- Development default: in-process SQLite (zero setup, single writer) ---
  url: sqlite:///taxii_feed.db

  # --- PRODUCTION: point at a real database instead of SQLite. ---
  # Recommended: PostgreSQL (best concurrent read/write — Vision One polls
  # while the poller/ingest writes). MariaDB/MySQL is a fine alternative if
  # that's your org standard.
  #
  #   PostgreSQL  (pip install psycopg2-binary):
  #   url: postgresql+psycopg2://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
  #
  #   MariaDB/MySQL (pip install PyMySQL):
  #   url: mysql+pymysql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
  #
  # ${VAR:-default} placeholders are resolved from the environment at
  # startup, so keep credentials in env vars, not in this file.
  #
  # url: postgresql+psycopg2://taxii:CHANGE_ME@localhost:5432/taxii_feed
  #
  # Connection pool (only used for server databases, ignored by SQLite):
  pool_size: 5
  max_overflow: 10
  connection_timeout: 30

security:
  auth_required: false
  # Set FLASK_SECRET in the .env file (see .env.example) — required.
  # No fallback default: an empty secret means unsignable session cookies.
  secret_key: ${FLASK_SECRET}

logging:
  level: INFO
  format: '[%(asctime)s] %(levelname)s: %(message)s'

taxii:
  protocol_version: '2.1'
  response_format: 'STIX_JSON'
  max_objects: 10000
  bundle_id: 'Bundle-{timestamp}'
  # === The ONE place Vision One is configured on THIS server ===
  # Trend Micro Vision One is a TAXII 2.1 CLIENT. It polls this server's
  #   http://<this-server>:5000/taxii2/
  # using the HTTP Basic credentials below (username + password).
  # Collection id:  threat-intel
  collection_id: 'threat-intel'
  collection_title: 'Custom Threat Intelligence Feed'
  # TAXII client credentials (HTTP Basic) — enter these in Vision One.
  # Values live in .env (see .env.example); no default here on purpose.
  auth:
    username: '${TAXII_AUTH_USER}'
    password: '${TAXII_AUTH_PASSWORD}'

# ---------------------------------------------------------------------------
# INDICATOR LIFECYCLE / TTL (aging & auto-revocation)
# Dynamic indicators age out. When an object is older than its per-type TTL
# (measured from last_seen, falling back to first_seen/modified) it is
# auto-REVOKED — served to Vision One as STIX `revoked: true` so the client
# drops it — NOT deleted (stays in the DB for audit). IPs expire fast; file
# hashes stay much longer. Set enabled: false, or a type's days to null, to
# turn it off. Manual revocation is separate: use the UI or
# POST /objects/<id>/revoke (action: revoke | unrevoke).
# ---------------------------------------------------------------------------
lifecycle:
  enabled: true
  sweep_interval: 3600     # seconds between auto-revocation sweeps
  ipv4_days: 14            # IPs are dynamic — short TTL
  domain_days: 30          # FQDNs — medium TTL
  file_days: 180           # file hashes are stable — long TTL
  indicator_days: 30       # free-form / pattern indicators

# ---------------------------------------------------------------------------
# INTEL FILTER — the gate between THIS server and Vision One
#   community -> this server -> [intel_filter] -> Vision One
#
# This is a READ-TIME gate applied only to the /taxii2/ collection that
# Vision One polls. Every object stays stored in the DB (auditable); the
# filter only decides what Vision One is actually served, to reduce false
# positives. It applies to COMMUNITY-sourced intel (OTX, third-party TAXII
# pulls) — your manually-fed intel (web UI / API, source 'manual') always
# passes. The web UI shows all stored intel regardless.
#
# All four rules below are toggles. Defaults = private-IP drop ON and a
# 30-day freshness window ON; confidence floor OFF; blocklist empty.
# ---------------------------------------------------------------------------
intel_filter:
  # Which source tags are "community" and therefore gated. Manual is never
  # gated no matter what.
  #   []            (default) -> gate EVERY non-manual source (otx, taxii pulls)
  #   ['otx', ...]  -> gate ONLY these named sources
  community_sources: []

  # 1) Drop non-routable / special-use IPv4 addresses (10/8, 172.16/12,
  #    192.168/16, 127/8, 169.254/16, 0/8, 240/4, mapped-v6, CGNAT, reserved).
  #    These dominate OTX honeypot feeds and are the top source of noise.
  drop_private_ips: true

  # 2) Freshness window: withhold community objects last seen/modified more
  #    than N days ago. Set null (or omit) to disable.
  freshness_days: 30

  # 3) Confidence floor: withhold community objects below this confidence.
  #    Set null to disable. (OTX community objects default to confidence 70.)
  min_confidence: null

  # 4) Explicit blocklist: exact values to always withhold (case-insensitive
  #    match on IP / domain / hash / name). E.g. your internal ranges or
  #    example.com. Leave empty to disable.
  blocklist: []
    # - '10.20.0.0/8'   # NOTE: single values today, not CIDR — see README
    # - 'example.com'

# ---------------------------------------------------------------------------
# WEB UI LOGIN — the dashboard (http://<server>:5000/) is behind a login.
# This is SEPARATE from `taxii.auth` (which is what Vision One uses to poll
# /taxii2/). The UI signs a session cookie after login; the data endpoints
# accept EITHER the UI session OR the TAXII credentials (scripts/curl).
# Keep this private. Values live in .env (see .env.example); set a strong
# password there. Set FLASK_SECRET to protect the cookie signature.
# ---------------------------------------------------------------------------
ui:
  auth:
    username: '${UI_AUTH_USER}'
    password: '${UI_AUTH_PASSWORD}'
  session_ttl: 43200        # session lifetime, seconds (default 12 h)

# ---------------------------------------------------------------------------
# SSO — Microsoft Entra ID (Azure AD) via OIDC. OFF by default.
#
# When enabled, the login page shows "Sign in with Microsoft" (Authorization
# Code + PKCE). Local username/password (ui.auth above) stays as a fallback.
#
# Egress: only login.microsoftonline.com is contacted (the browser for the
# sign-in screen; this server to exchange the code + fetch the signing keys).
#
# Access control (two layers):
#   1. PRIMARY  — assign the Entra app to a tenant group in the Azure portal
#      (App registration -> Enterprise application -> Users and groups).
#      Only assigned users can even reach the sign-in screen.
#   2. OPTIONAL — server-side allow-lists below (defense-in-depth). Leave the
#      lists empty to rely on Entra assignment alone.
#
# Setup (Azure portal):
#   1. App registrations -> New registration. Name it; Supported account
#      types = "Single tenant". Under Authentication -> Add a platform -> Web
#      -> Redirect URI, add BOTH:
#         http://localhost:5000/ui/sso/callback   (local HTTP testing)
#         https://<live-host>/ui/sso/callback     (production, HTTPS required)
#   2. Certificates & secrets -> New client secret -> copy the VALUE.
#   3. Overview -> note the Application (client) ID and Tenant ID.
#   4. (Access) Enterprise application for this app -> Users and groups ->
#      Add users/groups = the group of allowed operators.
#   5. Fill in client_id / tenant / redirect_uri below, put client_secret
#      in the .env file (see .env.example), set enabled: true, restart.
#
# redirect_uri must EXACTLY match one registered in the app (scheme, host,
# port, path). For local testing use the http://localhost:5000 one.
# ---------------------------------------------------------------------------
sso:
  enabled: false
  tenant: 'common'              # your tenant ID (GUID) or name; 'common' = any org tenant
  client_id: ''                 # Application (client) ID from the app registration
  client_secret: '${SSO_CLIENT_SECRET:-}'   # put the value in .env (see .env.example)
  redirect_uri: 'http://localhost:5000/ui/sso/callback'
  # issuer: ''                  # optional explicit ID-token issuer (default: auto)
  # allowed_domains: ['contoso.com']   # only these UPN/email domains
  # allowed_upns: ['jdoe@contoso.com'] # or exact UPNs
  # allowed_groups: ['<entra-group-object-id>'] # must match a token 'groups' claim

# ---------------------------------------------------------------------------
# OPTIONAL background pollers — off by default. Neither is how Vision One
# works; Vision One polls /taxii2/ on its own (see taxii.auth).
#
# 1) otx: pulls community threat intel FROM AlienVault OTX (public pulses /
#    indicators) into this feed, in merge mode tagged source='otx'.
#    It never wipes your manual/web-UI intel, and a UI save never wipes
#    OTX intel. Data flow: OTX -> this server -> Vision One.
# 2) self_check (formerly "vision_one"): a self-test that polls this
#    server's OWN /feed endpoint to confirm it stays reachable. Not Vision One.
# 3) taxii_pullers: pull STIX 2.1 objects FROM any third-party TAXII 2.1
#    server (see below). Each pulled object is tagged with the puller's
#    `name` as its source, so it is gated like other community intel.
# ---------------------------------------------------------------------------

otx:
  enabled: false               # set true to start pulling community intel from OTX
  base_url: 'https://otx.alienvault.com'   # OTX API base (no trailing slash)
  api_key: ''                  # optional free OTX API key (raises rate limits)
  poll_interval: 300           # seconds between poll cycles (5 min)
  max_pulses: 25               # recently-updated pulses inspected per poll
  min_indicator_count: 1       # skip pulses with fewer indicators than this
  max_indicators_per_pulse: 1000
  max_indicators_per_poll: 5000
  object_types: ['ipv4-addr', 'domain-name', 'file-hash']

# ---------------------------------------------------------------------------
# THIRD-PARTY TAXII 2.1 PULLERS — pull objects FROM other TAXII servers.
# Add one entry per source. `name` doubles as the object `source` tag and
# the dashboard label. Enable via `enabled: true` OR hit "Pull now" in the
# UI (works even when disabled, for a one-shot fetch).
# Example (AlienVault OTX also exposes a TAXII 2.1 server you can point here
# at, or any other provider that offers a TAXII 2.1 API root):
#
# taxii_pullers:
#   - name: otx-taxii
#     base_url: https://otx.alienvault.com/taxii2/
#     username: 'your-otx-api-key'      # OTX uses the API key as username
#     password: ''
#     collection: 'threat-intel'
#     poll_interval: 300
#     max_objects_per_poll: 5000
#     enabled: true
# ---------------------------------------------------------------------------
taxii_pullers: []
  # - name: otx-taxii
  #   base_url: https://otx.alienvault.com/taxii2/
  #   username: 'your-otx-api-key'
  #   password: ''
  #   collection: 'threat-intel'
  #   poll_interval: 300
  #   max_objects_per_poll: 5000
  #   enabled: false

self_check:
  enabled: false
  base_url: 'http://127.0.0.1:5000'
  poll_interval: 60

subscriptions:
  max_per_client: 10
  timeout: 300
